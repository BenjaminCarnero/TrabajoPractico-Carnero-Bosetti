<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero - Nombre del negocio</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header class="encabezado">
        <h1>Nombre del negocio</h1>
        <nav class="menu">
            <a href="index.html">Operación</a>
            <a href="tablero.html" class="activo">Tablero</a>
            <a href="estadisticas.html">Estadísticas</a>
        </nav>
    </header>

    <main class="principal">
        <section class="seccion">
            <h2>Tablero</h2>
            
<div class="resumen-tablero">
    <div class="tarjeta">
        <h3>Clientes</h3>
        <p id="totalClientes">0</p>
    </div>
    <div class="tarjeta">
        <h3>Turnos totales</h3>
        <p id="totalTurnos">0</p>
    </div>
    <div class="tarjeta">
        <h3>Turnos pendientes</h3>
        <p id="turnosPendientes">0</p>
    </div>
    <div class="tarjeta">
        <h3>Turnos finalizados</h3>
        <p id="turnosFinalizados">0</p>
    </div>
</div>

            <!-- Acá va el listado con JOIN, la búsqueda con filtros y los botones de cambio de estado. -->
            
<h2>Listado de turnos</h2>

<div class="filtros-turnos">
    <input
        type="text"
        id="filtroCliente"
        placeholder="Buscar por cliente"
    >

    <input
        type="text"
        id="filtroPatente"
        placeholder="Buscar por patente"
    >

    <select id="filtroEstado">
        <option value="">Todos los estados</option>
        <option value="Pendiente">Pendiente</option>
        <option value="Confirmado">Confirmado</option>
        <option value="EnProceso">En proceso</option>
        <option value="Finalizado">Finalizado</option>
        <option value="Cancelado">Cancelado</option>
    </select>
</div>

<table>
    <thead>
        <tr>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Cliente</th>
            <th>Patente</th>
            <th>Vehículo</th>
            <th>Servicios</th>
            <th>Total</th>
            <th>Estado</th>
            <th>Cambiar estado</th>
        </tr>
    </thead>
    <tbody id="tablaTurnos">
    </tbody>
</table>
 
        </section>
    </main>

    <script type="module" src="js/tablero.js"></script>
</body>
</html>
